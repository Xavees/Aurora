name: Aurora Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint e testes
    runs-on: ubuntu-latest

    services:
      db:
        image: mariadb:10.4.32
        env:
          MARIADB_ROOT_PASSWORD: root-ci-only
          MARIADB_DATABASE: aurora_test
          MARIADB_USER: aurora_e2e
          MARIADB_PASSWORD: e2e-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar aplicação
        run: npm run build

      - name: Verificar lint
        run: npm run lint

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Executar testes unitários
        run: npm test

      - name: Importar estrutura do banco de testes
        env:
          MYSQL_PWD: root-ci-only
        run: |
          docker exec -i \
            -e MYSQL_PWD="$MYSQL_PWD" \
            "${{ job.services.db.id }}" \
            mysql -uroot aurora_test < bancodeDadosTemp.sql

      - name: Validar estrutura do banco de testes
        env:
          MYSQL_PWD: root-ci-only
        run: |
          CONTAINER="${{ job.services.db.id }}"

          TABLES=$(docker exec \
            -e MYSQL_PWD="$MYSQL_PWD" \
            "$CONTAINER" \
            mysql -uroot -N -s -e \
            "SELECT COUNT(*) FROM information_schema.TABLES
             WHERE TABLE_SCHEMA = 'aurora_test'
             AND TABLE_TYPE = 'BASE TABLE';")

          FOREIGN_KEYS=$(docker exec \
            -e MYSQL_PWD="$MYSQL_PWD" \
            "$CONTAINER" \
            mysql -uroot -N -s -e \
            "SELECT COUNT(*) FROM information_schema.TABLE_CONSTRAINTS
             WHERE TABLE_SCHEMA = 'aurora_test'
             AND CONSTRAINT_TYPE = 'FOREIGN KEY';")

          echo "Tabelas encontradas: $TABLES"
          echo "Chaves estrangeiras encontradas: $FOREIGN_KEYS"

          if [ "$TABLES" -ne 12 ] || [ "$FOREIGN_KEYS" -ne 18 ]; then
            echo "::error::Estrutura do banco de testes incompleta."
            exit 1
          fi

          echo "Estrutura do banco validada com sucesso."

      - name: Executar testes E2E
        env:
          CI: 'true'
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: aurora_e2e
          DB_PASSWORD: e2e-ci-only
          DB_DATABASE: aurora_test
          JWT_SECRET: aurora-ci-jwt-secret-for-tests-only
        run: npm run test:e2e:ci
